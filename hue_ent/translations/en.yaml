configuration:
  log_level:
    name: Log level
    description: >-
      App log verbosity. 'debug' logs every state transition - use it only when
      troubleshooting.
  auto_zones:
    name: Auto zones
    description: >-
      Build one zone per Home Assistant area from your color-capable Philips
      Hue bulbs, with the room's Adaptive Lighting switch auto-detected as a
      pause entity. Fine-tune everything in the sidebar panel. Turn off to
      define all zones manually below.
  ledfx_url:
    name: LedFX URL
    description: >-
      Only set this if you're using LedFX - then the app auto-creates one
      matching DDP device per zone named "Hue <zone>". Typical value:
      http://127.0.0.1:8888 (LedFX on the same host). Leave EMPTY for
      HyperHDR, piccap or any other DDP source - just point them at each
      zone's ddp_port (shown in the sidebar panel), no provisioning needed.
  ledfx_ddp_target:
    name: LedFX DDP target
    description: >-
      Only relevant when LedFX URL is set. The address LedFX sends pixel data
      to (where this app listens). Leave at 127.0.0.1 unless LedFX runs on a
      different machine.
  zones:
    name: Zones
    description: >-
      Entertainment zones (max 10 lights each). Per zone: name; lights =
      zigbee2mqtt friendly names in pixel order; proxy = re-broadcasting bulb
      (defaults to the first light; must be in radio range of the others);
      fps (5-25, default 25 = protocol ceiling); ddp_port = this zone's DDP UDP listen port
      (default 4048 + index); idle_timeout_s = auto-stop after this many
      seconds without DDP, counted from the arm if none ever arrives
      (default 30); auto_start = arm when DDP arrives
      (default true); brightness_scale = global output multiplier (0.05-3.0;
      1.0 pass-through; >1 boosts perceived brightness and clips at max, like
      Hue Sync's "vibrancy"); bri_floor = minimum brightness value sent
      (1-200, default 1 = protocol minimum); raise to ~20-50 if the strip
      firmware drops to warm-white on very-low computed brightness;
      pause_entities = entities switched off while streaming (e.g. your
      Adaptive Lighting switch) and restored afterwards.
